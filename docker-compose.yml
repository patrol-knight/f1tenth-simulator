services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    network_mode: "host"
    volumes:
      - .:/workspace/src/f1tenth_simulator
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - LIBGL_DRI3_DISABLE=1
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMEENTATION=rmw_cyclonedds_cpp

    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        cd /workspace &&
        rosdep install -i --from-path src --rosdistro humble -y &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        ros2 launch f1tenth_simulator bridge.launch.py
      "
      